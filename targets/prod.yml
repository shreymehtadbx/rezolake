# Production: the live app. Deploy only from main.
targets:
  prod:
    workspace:
      host: https://<your-workspace>.cloud.databricks.com
      profile: DEFAULT
      # Deployment state from before targets were split (was the implicit "default" target).
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/default
    variables:
      catalog: your_catalog
      sql_warehouse_id: "<your-sql-warehouse-id>"
      lakebase_project: projects/rezolake-postgres-db
