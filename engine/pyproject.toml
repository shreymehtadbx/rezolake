[project]
name = "rezolake_engine"
version = "0.4.1"
description = "Rezolake resolution engine: ingest, canonicalize, block, match, decide, cluster, survive"
requires-python = ">=3.10"
dependencies = [
  "databricks-sdk>=0.103.0",
  "psycopg[binary]>=3.1",
  "dspy>=2.6",
  "mlflow-skinny>=3.1",  # tracing only; preinstalled on serverless environment 6
  "pydantic>=2.11",
  "typing_extensions>=4.13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
main = "rezolake_engine.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rezolake_engine"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
